/* ============================== TOKENS ==============================
   Avoya Travel Network's own colors and type, read from AvoyaNetwork.com (img/BRAND.md).
   Links and small blue text use the site's darker link-hover blue (#2D667D): the brand's #5191AB
   is too light for small text on white, so it's kept for bars, rules and large shapes. */
:root {
  color-scheme: light;
  --ink: #3C4B55;          /* slate: the site's header bar, body text and headings */
  --ink-2: #4E5E69;        /* secondary text (the site's footer text) */
  --ink-3: #5F6E79;        /* quiet text; 5.3:1 on white */
  --night: #2A353D;        /* the reveal stage, a step darker than the header */
  --night-2: #34434D;
  --gold: #FFC859;         /* primary buttons */
  --gold-2: #FFD176;       /* primary hover, check marks on dark */
  --blue: #5191AB;         /* bars, rules, large shapes */
  --blue-2: #67A5BE;
  --blue-ink: #2D667D;     /* links and small blue text */
  --sky: #8ABBD0;          /* the logo's blue: accents on dark */
  --teal: #3E7B94;
  --brick: #A9503B;        /* form errors (always with words) */
  --paper: #FEFEFE;
  --mist: #F0F4F7;
  --fog: #E2E7ED;
  --line: #CED6DE;
  --r-s: 4px;              /* controls and buttons, as on the site */
  --r-m: 8px;              /* cards */
  --r-l: 14px;             /* the stage and the type card */
  --ui: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --num: 'Barlow Condensed', 'Barlow', 'Arial Narrow', sans-serif;
  --gut: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--paper); color: var(--ink);
  font: 400 17px/1.5 var(--ui); overflow-x: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue-ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: #1f4f61; }
:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }

/* ============================== BUTTONS ============================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
  padding: 12px 22px; border: 0; border-radius: var(--r-s); background: var(--gold); color: var(--ink);
  font: 600 16px/1.15 var(--ui); letter-spacing: .8px; text-transform: uppercase; text-decoration: none;
  transition: background-color .15s ease, box-shadow .15s ease, color .15s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:hover { background: var(--gold-2); color: var(--ink); }
.btn:active { background: #F5BB45; }
.btn:disabled { background: var(--fog); color: var(--ink-3); cursor: default; }
.btn.block { width: 100%; }
.btn.blue { background: var(--blue-ink); color: #fff; }
.btn.blue:hover { background: #255868; color: #fff; }
.btn.line { background: transparent; color: var(--blue-ink); box-shadow: inset 0 0 0 2px var(--blue-ink); }
.btn.line:hover { background: var(--mist); }
.btn.onDark { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #fff; }
.btn.onDark:hover { background: #fff; color: var(--ink); }
.btn.small { min-height: 38px; padding: 8px 14px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue-ink); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
.linkbtn:hover { color: #1f4f61; }

/* ============================== THE FRAME ============================== */
.top {
  position: sticky; top: 0; z-index: 30; height: 52px; padding: 0 var(--gut);
  padding-left: max(var(--gut), env(safe-area-inset-left)); padding-right: max(var(--gut), env(safe-area-inset-right));
  display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff;
}
.top .logo { height: 30px; width: auto; }
.top .beta { font: 600 11px/1 var(--ui); letter-spacing: 1px; text-transform: uppercase; color: var(--sky); box-shadow: inset 0 0 0 1px rgba(138,187,208,.6); border-radius: 3px; padding: 4px 6px 3px; }
.top .grow { flex: 1; }
.top .count { font: 600 15px/1 var(--num); letter-spacing: .5px; color: #dfe8ee; font-variant-numeric: tabular-nums; }
.top .count b { color: #fff; font-weight: 700; }
.iconbtn {
  width: 40px; height: 40px; margin-right: -8px; display: grid; place-items: center; border: 0; border-radius: var(--r-s);
  background: transparent; color: #dfe8ee; font-size: 22px; transition: background-color .15s ease, color .15s ease;
}
.iconbtn:hover { background: rgba(255,255,255,.1); color: #fff; }
.iconbtn[aria-pressed="true"] { color: var(--gold); }

/* the run's progress: one segment per question, grouped by part */
.prog { display: flex; gap: 10px; padding: 0 var(--gut); background: var(--ink); height: 6px; }
.prog .trip { flex: 1; display: flex; gap: 2px; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.22); transition: background-color .3s ease; }
.prog i.done { background: var(--sky); }
.prog i.now { background: var(--gold); }

main { display: block; }
.wrap { width: 100%; max-width: 620px; margin: 0 auto; padding: 0 var(--gut); }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); z-index: 80; max-width: calc(100vw - 32px);
  transform: translate(-50%, 24px); opacity: 0; pointer-events: none; padding: 11px 16px; border-radius: var(--r-m);
  background: var(--ink); color: #fff; font-size: 15px; transition: opacity .2s ease, transform .25s ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.pill {
  position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 70;
  padding: 6px 12px; border-radius: 999px; background: var(--ink); color: #fff; font: 600 13px/1.2 var(--ui); letter-spacing: .3px;
}
.banner { padding: 10px var(--gut); background: #FFF4D6; color: var(--ink); font-size: 14px; line-height: 1.4; }
.banner b { font-weight: 700; }

/* ============================== LANDING ============================== */
.hero { position: relative; color: #fff; background: var(--night) center 62% / cover no-repeat; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,53,61,.35) 0%, rgba(42,53,61,.55) 45%, rgba(42,53,61,.92) 100%); }
.hero .wrap { position: relative; padding-top: 44px; padding-bottom: 28px; min-height: min(560px, calc(100svh - 52px)); display: flex; flex-direction: column; justify-content: flex-end; }
.hero h1 { margin: 0 0 14px; font: 400 40px/1.06 var(--ui); letter-spacing: .8px; text-transform: uppercase; text-wrap: balance; }
.hero .sub { margin: 0 0 22px; font-size: 19px; line-height: 1.45; color: #eef3f6; max-width: 30em; }
.hero .shared { margin: 0 0 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--gold-2); }
.hero .btn { width: 100%; }
.hero .meta { margin: 12px 0 0; font-size: 15px; color: #dfe8ee; }
.land-more { padding-top: 22px; padding-bottom: 36px; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.how li { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start; }
.how .n { font: 700 30px/1 var(--num); color: var(--blue); text-align: center; padding-top: 2px; }
.how b { display: block; font-weight: 600; }
.how span { color: var(--ink-2); font-size: 16px; }
.land-note { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--fog); font-size: 15px; color: var(--ink-2); }
.last-result { margin: 18px 0 0; padding: 12px 14px; border-radius: var(--r-m); background: var(--mist); font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

/* ============================== TITLE CARDS ============================== */
.tcard {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
  background: rgba(42,53,61,.985); color: #fff; text-align: center; cursor: pointer;
}
.tcard .in { max-width: 420px; }
.tcard .k { font: 600 14px/1 var(--ui); letter-spacing: 2px; text-transform: uppercase; color: var(--sky); margin-bottom: 14px; }
.tcard h2 { margin: 0; font: 700 46px/1 var(--num); letter-spacing: .5px; text-transform: uppercase; }
.tcard p { margin: 14px 0 0; font-size: 18px; color: #e3ebf0; }
.tcard .rule { width: 56px; height: 3px; background: var(--gold); margin: 18px auto 0; border-radius: 2px; }
.tcard.enter .in { animation: cardIn .5s cubic-bezier(.16,1,.3,1) both; }
.tcard.leave { animation: fadeOut .28s ease forwards; }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes fadeOut { to { opacity: 0; } }

/* ============================== THE BLUEPRINT REVEAL ============================== */
.build { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: var(--night); color: #fff; text-align: center; cursor: pointer; }
.build .in { width: 100%; max-width: 460px; }
.build .k { font: 600 14px/1 var(--ui); letter-spacing: 2px; text-transform: uppercase; color: var(--sky); }
.build .row { margin-top: 26px; }
.build .lab { font: 600 13px/1 var(--ui); letter-spacing: 1.4px; text-transform: uppercase; color: #c9d6de; }
.build .win { position: relative; height: 64px; margin-top: 10px; overflow: hidden; border-radius: 10px; background: #1d262c; box-shadow: inset 0 0 0 2px #4a5c68; transition: background-color .35s ease, box-shadow .35s ease; }
.build .win::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(29,38,44,.85), rgba(29,38,44,0) 32%, rgba(29,38,44,0) 68%, rgba(29,38,44,.85)); transition: opacity .3s ease; }
.build .strip { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
.build .it { height: 64px; display: grid; place-items: center; padding: 6px 10px 0; font: 700 clamp(24px, 7.4vw, 36px)/1 var(--num); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; color: #8ea3b0; }
.build .row.locked .win { background: rgba(255,200,89,.08); box-shadow: inset 0 0 0 2px var(--gold), 0 0 22px rgba(255,200,89,.18); }
.build .row.locked .win::after { opacity: 0; }
.build .row.locked .it.fin { color: var(--gold); text-shadow: 0 0 14px rgba(255,200,89,.4); animation: lockHit .32s cubic-bezier(.2,1.6,.4,1); }
@keyframes lockHit { from { transform: scale(1.12); } to { transform: none; } }
.build .skip { margin-top: 30px; padding: 6px 8px; border: 0; background: none; color: #c9d6de; font: 500 15px/1 var(--ui); text-decoration: underline; text-underline-offset: 2px; }
.build .skip:hover { color: #fff; }
.build .in { animation: cardIn .45s cubic-bezier(.16,1,.3,1) both; }
.build.leave { animation: fadeOut .3s ease forwards; }

/* ============================== THE ITEM ============================== */
.item { padding-bottom: calc(28px + var(--safe-b)); }
.photo { position: relative; margin: 0 calc(var(--gut) * -1); background: var(--fog); aspect-ratio: 16 / 10; max-height: 34vh; max-height: 34svh; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s ease; }
.photo img.on { opacity: 1; }
.photo .credit { position: absolute; right: 6px; bottom: 5px; max-width: 70%; padding: 2px 6px; border-radius: 3px; background: rgba(42,53,61,.72); color: #fff; font-size: 11px; line-height: 1.3; text-align: right; }
.photo .credit a { color: #fff; }
.chips { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
.chip.part { min-width: 0; }
.chip.part > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 3px; border-radius: 3px; background: var(--mist); color: var(--ink-2); font: 600 13px/1.3 var(--ui); letter-spacing: .4px; text-transform: uppercase; }
.chip.ex { background: #FFF1CC; color: #5b4a17; }
.q { margin: 0 0 16px; font: 600 22px/1.3 var(--ui); color: var(--ink); text-wrap: pretty; }
.q.withhint { margin-bottom: 4px; }
.qhint { margin: 0 0 14px; font-size: 16px; color: var(--ink-2); }
.q:focus { outline: none; }
.q:focus-visible { outline: 3px solid var(--blue-ink); outline-offset: 4px; }

.item.bare { padding-top: 6px; }
.chips .back { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 0; border: 0; background: none; color: var(--blue-ink); font: 500 15px/1.3 var(--ui); text-decoration: underline; text-underline-offset: 2px; }
.chips .back .icon { font-size: 17px; }
.chips .back:hover { color: #1f4f61; }

/* the options: lettered cards (one pick), check cards (up to three) */
.opts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.opt {
  width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left;
  border: 0; border-radius: var(--r-s); background: #fff; box-shadow: inset 0 0 0 2px var(--line); color: var(--ink);
  font: 500 17px/1.35 var(--ui); transition: box-shadow .15s ease, background-color .2s ease, color .2s ease, opacity .2s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
@media (hover: hover) { .opt:hover { box-shadow: inset 0 0 0 2px var(--blue-ink); } }
.opt .key, .opt .box { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 3px; background: var(--mist); font: 700 16px/1 var(--num); color: var(--ink-2); transition: background-color .15s ease, color .15s ease; }
.opt .box { background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 18px; color: transparent; }
.opt.pick { background: #FFF8E6; box-shadow: inset 0 0 0 2px var(--ink); }
.opt.pick .key { background: var(--ink); color: #fff; }
.opt.pick .box { background: var(--ink); box-shadow: none; color: var(--gold); }
.opt.full { opacity: .55; }
.mhint { min-height: 20px; margin: 10px 2px 0; font-size: 15px; color: var(--ink-2); }
.mhint.nudge { color: #8a6412; font-weight: 500; animation: nudge .4s ease; }
@keyframes nudge { 20% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 80% { transform: translateX(-2px); } }

/* photo tiles (Part 2's first question) */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; padding: 0; list-style: none; }
.tile {
  position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: stretch; padding: 0 0 10px; overflow: hidden; text-align: left;
  border: 0; border-radius: var(--r-m); background: #fff; box-shadow: inset 0 0 0 2px var(--line); color: var(--ink);
  transition: box-shadow .15s ease, background-color .2s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
@media (hover: hover) { .tile:hover { box-shadow: inset 0 0 0 2px var(--blue-ink); } }
.tile .tim { display: block; aspect-ratio: 4 / 3; background: var(--fog); overflow: hidden; border-radius: 6px 6px 0 0; margin: 2px 2px 0; }
.tile .tim img { width: 100%; height: 100%; object-fit: cover; }
.tile .tt { display: block; margin: 9px 10px 0; font: 600 16px/1.25 var(--ui); }
.tile .ts { display: block; margin: 3px 10px 0; font-size: 13.5px; line-height: 1.35; color: var(--ink-3); }
.tile .tick { position: absolute; top: 9px; right: 9px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--ink); font-size: 18px; opacity: 0; transform: scale(.6); transition: opacity .15s ease, transform .2s cubic-bezier(.2,1.5,.4,1); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.tile.pick { background: #FFF8E6; box-shadow: inset 0 0 0 3px var(--ink); }
.tile.pick .tick { opacity: 1; transform: none; }
.tcredit { margin: 8px 0 0; font-size: 12px; line-height: 1.4; color: var(--ink-3); }
.tcredit a { color: var(--ink-3); }

/* the insight for a pick */
.insight { margin-top: 14px; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r-m); background: var(--mist); box-shadow: inset 4px 0 0 var(--gold); }
.insight .ic { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--ink); font-size: 17px; }
.insight p { margin: 0; font-size: 17px; line-height: 1.45; }
.insight .crowd { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--blue-ink); font-weight: 500; }
.insight .crowd .icon { font-size: 18px; }
.insight.swap > div { animation: swapIn .3s ease; }
@keyframes swapIn { from { opacity: .2; } to { opacity: 1; } }

/* ============================== NEXT ============================== */
.next { margin-top: 18px; }
.next .btn { width: 100%; }
.next p { margin: 8px 0 0; text-align: center; font-size: 14px; color: var(--ink-3); }

/* ============================== THE RESULT PAGE ============================== */
.typecard { position: relative; margin: 16px 0 0; border-radius: var(--r-l); overflow: hidden; color: #fff; background: var(--night) center 60% / cover no-repeat; }
.typecard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(42,53,61,.55), rgba(42,53,61,.86) 55%, rgba(42,53,61,.96)); }
.typecard .in { position: relative; padding: 26px 20px 22px; }
.typecard .k { font: 600 14px/1 var(--ui); letter-spacing: 2px; text-transform: uppercase; color: var(--sky); }
.nw { white-space: nowrap; }
.typecard h1 { margin: 8px 0 0; font: 700 48px/.98 var(--num); letter-spacing: .4px; text-transform: uppercase; color: #fff; text-wrap: balance; }
@media (max-width: 374px) { .typecard h1 { font-size: 42px; } }
.typecard .line { margin: 12px 0 0; font-size: 19px; line-height: 1.4; color: #eef3f6; }
.typecard .second { margin: 8px 0 0; font: 500 19px/1.3 var(--ui); color: var(--gold-2); }
.bp { margin: 18px 0 0; display: grid; gap: 0; }
.bp > div { display: grid; grid-template-columns: 108px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.18); }
.bp dt { padding-top: 2px; font: 600 12.5px/1.35 var(--ui); letter-spacing: 1px; text-transform: uppercase; color: var(--sky); }
.bp dd { margin: 0; font: 500 17px/1.35 var(--ui); color: #fff; }
.bp dd small { display: block; margin-top: 2px; font-size: 14.5px; font-weight: 400; color: #c9d6de; }
.pct { margin: 14px 0 0; font-size: 17px; color: #fff; }
.advline { margin: 4px 0 0; font-size: 15px; color: #c9d6de; }
.typecard .btn { margin-top: 18px; width: 100%; }
.sec { margin: 28px 0 0; }
.sec > h2 { margin: 0 0 12px; font: 400 24px/1.2 var(--ui); letter-spacing: .6px; text-transform: uppercase; color: var(--ink); }
.bars { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
.bars li { display: grid; gap: 6px; }
.bars .top2 { display: flex; justify-content: space-between; gap: 10px; font-size: 16px; }
.bars .top2 b { font-weight: 600; }
.bars .top2 span { font: 600 18px/1.2 var(--num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bar { position: relative; height: 12px; border-radius: 6px; background: var(--fog); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--blue); width: 0; transition: width .9s cubic-bezier(.16,1,.3,1); }
.bar i.up { background: var(--gold); }
.bars-note { margin: 10px 0 0; font-size: 14px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 16px; }
.steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; }
.steps .n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--gold); font: 700 22px/1 var(--num); }
.steps h3 { margin: 6px 0 2px; font: 600 18px/1.3 var(--ui); }
.steps p { margin: 0; font-size: 16px; color: var(--ink-2); }
.costs { margin: 16px 0 0; padding: 14px; border-radius: var(--r-m); background: var(--mist); font-size: 16px; }
.costs b { font-weight: 600; }
.costs a { display: inline-block; margin-top: 6px; font-weight: 500; }
.fits { display: grid; gap: 10px; }
.fit { padding: 14px 16px 15px; border-radius: var(--r-m); background: var(--mist); box-shadow: inset 4px 0 0 var(--blue); }
.fit .k { font: 600 12.5px/1.3 var(--ui); letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); }
.fit h3 { margin: 4px 0 4px; font: 600 19px/1.3 var(--ui); color: var(--ink); }
.fit p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--ink-2); }

/* the form */
.form { margin: 28px calc(var(--gut) * -1) 0; padding: 22px var(--gut) 24px; background: var(--fog); }
.form h2 { margin: 0 0 4px; font: 400 24px/1.2 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.form .lede { margin: 0 0 14px; color: var(--ink-2); font-size: 16px; }
.form .q2 { margin: 0 0 10px; font: 600 18px/1.3 var(--ui); }
.choices { display: grid; gap: 8px; }
.choice { min-height: 50px; padding: 10px 14px; border: 0; border-radius: var(--r-s); background: #fff; box-shadow: inset 0 0 0 2px var(--line); text-align: left; font: 500 17px/1.3 var(--ui); color: var(--ink); transition: box-shadow .15s ease, background-color .15s ease; }
@media (hover: hover) { .choice:hover { box-shadow: inset 0 0 0 2px var(--blue-ink); } }
.choice[aria-pressed="true"] { background: var(--ink); color: #fff; box-shadow: none; }
.step2 { margin-top: 18px; display: grid; gap: 12px; }
.field label { display: block; margin-bottom: 4px; font: 600 15px/1.3 var(--ui); }
.field label .opt2 { font-weight: 400; color: var(--ink-3); }
.field input { width: 100%; height: 48px; padding: 0 12px; border: 0; border-radius: var(--r-s); background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 17px; transition: box-shadow .15s ease; }
.field input:focus { outline: 0; box-shadow: inset 0 0 0 2px var(--blue-ink); }
.field input[aria-invalid="true"] { box-shadow: inset 0 0 0 2px var(--brick); }
.field .err { margin: 4px 0 0; font-size: 14px; color: var(--brick); font-weight: 500; }
.field .hint { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.check { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.45; color: var(--ink); }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ink); }
.hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
.formmsg { padding: 14px; border-radius: var(--r-m); background: #fff; font-size: 16px; }
.formmsg b { display: block; font: 600 19px/1.3 var(--ui); margin-bottom: 4px; }
.formmsg.wait b::after { content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 10px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* the answers recap */
.recap { margin: 28px 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.recap summary { list-style: none; cursor: pointer; padding: 14px 0; display: flex; align-items: center; justify-content: space-between; font: 600 17px/1.3 var(--ui); }
.recap summary::-webkit-details-marker { display: none; }
.recap summary .chev { transition: transform .2s ease; }
.recap[open] summary .chev { transform: rotate(180deg); }
.rows { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.rows li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--fog); }
.rows li:first-child { border-top: 0; }
.rows .i { font: 700 18px/1.3 var(--num); color: var(--ink-3); }
.rows .qq { font-size: 15px; line-height: 1.4; }
.rows .qq small { display: block; margin-top: 3px; color: var(--ink-2); font-size: 14px; }
.rows .tag { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 3px; background: var(--mist); color: var(--ink-2); font: 600 12px/1.5 var(--ui); letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }
.fine { margin: 26px 0 0; padding-bottom: calc(36px + var(--safe-b)); font-size: 13px; line-height: 1.5; color: var(--ink-3); }
.fine p { margin: 0 0 10px; }
.again { margin: 22px 0 0; text-align: center; }

/* back soon, errors */
.empty { padding: 48px 0; text-align: center; }
.empty h1 { margin: 0 0 8px; font: 400 32px/1.15 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.empty p { margin: 0 auto; max-width: 30em; color: var(--ink-2); }

/* ============================== LAPTOPS ============================== */
@media (min-width: 760px) {
  :root { --gut: 24px; }
  .hero h1 { font-size: 54px; }
  .hero .wrap { min-height: 560px; padding-bottom: 40px; }
  .hero .btn { width: auto; min-width: 280px; }
  .photo { margin: 18px 0 0; border-radius: var(--r-m); aspect-ratio: auto; height: 320px; max-height: none; }
  .q { font-size: 27px; }
  .item.bare { padding-top: 18px; }
  .tiles { grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .opt { font-size: 18px; }
  .typecard h1 { font-size: 60px; }
  .bp > div { grid-template-columns: 140px 1fr; }
  .fits { grid-template-columns: 1fr 1fr; gap: 12px; }
  .typecard .btn { width: auto; }
  .form { margin-left: 0; margin-right: 0; border-radius: var(--r-l); padding: 26px 24px; }
}

/* ============================== MOTION ============================== */
.enter { animation: rise .45s cubic-bezier(.16,1,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ============================== ADMIN ============================== */
.admin { padding: 18px 0 48px; }
.admin h1 { margin: 0 0 4px; font: 400 28px/1.2 var(--ui); letter-spacing: .6px; text-transform: uppercase; }
.admin h2 { margin: 26px 0 10px; font: 600 18px/1.3 var(--ui); }
.admin .card { border-radius: var(--r-m); background: var(--mist); padding: 14px; }
.admin table { width: 100%; border-collapse: collapse; font-size: 14px; }
.admin th, .admin td { padding: 7px 8px; border-bottom: 1px solid var(--fog); text-align: left; vertical-align: top; }
.wrap.admin { max-width: 1120px; }
.admin th { font-weight: 600; color: var(--ink-2); background: var(--mist); white-space: nowrap; }
.admin td { white-space: nowrap; }
.admin .grid2 td:first-child, .admin details.more td:first-child { white-space: normal; }
.admin .note { margin: 10px 0 0; font-size: 14px; color: var(--ink-3); }
.admin td.n, .admin th.n { text-align: right; font-variant-numeric: tabular-nums; }
.admin .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.admin .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.admin .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.admin .kv div { background: #fff; border-radius: var(--r-s); padding: 10px 12px; box-shadow: inset 0 0 0 1px var(--fog); }
.admin .kv b { display: block; font: 700 26px/1.1 var(--num); }
.admin .kv span { font-size: 13px; color: var(--ink-3); }
.admin .warn { padding: 12px 14px; border-radius: var(--r-m); background: #F6E4DF; color: #6e2f20; font-weight: 500; }
.admin .dupe { color: var(--brick); font-weight: 600; }
.admin select, .admin input[type=number] { height: 38px; padding: 0 8px; border: 0; border-radius: var(--r-s); background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; }
.admin code { font-size: 13px; background: var(--mist); padding: 2px 5px; border-radius: 3px; overflow-wrap: anywhere; }
.admin h3 { margin: 18px 0 8px; font: 600 16px/1.3 var(--ui); }
.admin .grid2 { display: grid; gap: 4px 28px; }
@media (min-width: 900px) { .admin .grid2 { grid-template-columns: 1fr 1fr; } }
.admin details.more { margin-top: 22px; border-top: 1px solid var(--fog); border-bottom: 1px solid var(--fog); padding: 4px 0 14px; }
.admin details.more summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.switch input { width: 20px; height: 20px; accent-color: var(--ink); }

</style>
</head>

})();

/* ============================== THE REEL (the blueprint reveal) ==============================
   One line of a slot reel: the names roll past in a window, slow down, nudge a hair past and settle on the answer.
   The strip is three shuffled laps (seeded by the run, so a reload rolls the same way) ending on the answer, which is
   never shown twice in a row at the end, with one more name after it for the nudge. */
function Reel(win, names, final, seed) {
  const r = seeded(seed), seq = [];
  for (let lap = 0; lap < 3; lap++) {
    const idx = names.map((_, k) => k);
    for (let k = idx.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [idx[k], idx[j]] = [idx[j], idx[k]]; }
    seq.push(...idx);
  }
  while (seq.length && seq[seq.length - 1] === final) seq.pop();
  seq.push(final, (final + 1) % names.length);
  const pos = seq.length - 2;
  win.innerHTML = `<div class="strip">${seq.map((k, n) => `<div class="it${n === pos ? ' fin' : ''}">${esc(names[k])}</div>`).join('')}</div>`;
  const strip = $('.strip', win), H = () => (strip.firstElementChild && strip.firstElementChild.offsetHeight) || 56;
  let anim = null, landed = false;
  function land() {
    if (anim) { try { anim.cancel(); } catch (e) { /* ignore */ } anim = null; }
    strip.style.transform = `translateY(${-pos * H()}px)`; landed = true;
  }
  function spin(dur, onLand) {
    const h = H(), y = -pos * h, done = () => { if (landed) return; land(); if (onLand) onLand(); };
    if (calmMotion() || !strip.animate) return done();
    anim = strip.animate([
      { transform: 'translateY(0)', offset: 0, easing: 'cubic-bezier(.32,.06,.18,1)' },
      { transform: `translateY(${(y - h * .2).toFixed(1)}px)`, offset: .88, easing: 'cubic-bezier(.45,0,.3,1)' },
      { transform: `translateY(${y}px)`, offset: 1 }
    ], { duration: dur, fill: 'forwards' });
    anim.onfinish = done;
  }
  return { spin, land, get landed() { return landed; } };
}

/* ============================== DATA STORE ==============================
   Player pages talk to the Realtime Database over plain HTTPS requests and hold no connection, so a paid campaign can't
   run into the free plan's 100 simultaneous connections (createRestStore, from the play-anytime engine). Demo mode keeps
   a pretend database in this browser instead, so the whole assessment and the admin page can be tried with nothing sent. */
function firebaseConfigured() {
  const u = (FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) || '';
  return /^https?:\/\//i.test(u) && !/your-project/i.test(u);
}
function restBase() { return String((FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) || '').replace(/[?#].*$/, '').replace(/\/+$/, ''); }

  const base = restBase(), ns = (String((FIREBASE_CONFIG && FIREBASE_CONFIG.databaseURL) || '').match(/[?&]ns=([^&#]+)/) || [])[1] || '';
  const norm = p => String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url = (p, silent) => { const q = [ns ? 'ns=' + ns : '', silent ? 'print=silent' : ''].filter(Boolean).join('&'); return base + '/' + norm(p) + '.json' + (q ? '?' + q : ''); };
  const stats = { reqs: 0, bytesIn: 0, bytesOut: 0 };   // what this page has sent and received (the traffic check reads it)
  async function req(method, path, body, ms = 12000) {

    async send(method, path, body) {

// A pretend Realtime Database in this browser, with the same server values (timestamp, increment) and the two rules
// that matter to the page: plays and leads can't be overwritten, and a counter only goes up by one.
function createDemoStore() {
  const K = 'cybta:demo:db';
  let db = KV.getJSON(K) || {};
  const segs = p => String(p).split('/').filter(Boolean);
  function read(path) { let o = db; for (const s of segs(path)) { if (!o || typeof o !== 'object') return null; o = o[s]; } return o === undefined ? null : JSON.parse(JSON.stringify(o)); }
  function resolve(v, cur) {
    if (v && typeof v === 'object' && v['.sv'] !== undefined) {
      if (v['.sv'] === 'timestamp') return Date.now();
      if (v['.sv'] && typeof v['.sv'] === 'object' && 'increment' in v['.sv']) return (typeof cur === 'number' ? cur : 0) + v['.sv'].increment;
    }
    if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v)) { const r = resolve(v[k], cur && cur[k]); if (r !== null && r !== undefined) o[k] = r; } return Object.keys(o).length ? o : null; }

  }

    mode: 'demo', stats: { reqs: 0, bytesIn: 0, bytesOut: 0 },
    async get(path) { return read(path); },
    async send(method, path, body) {

}

/* ============================== THE OUTBOX ==============================
   Every write waits here until the database has it, and is kept in this browser in case the page closes first (the
   play-anytime retry queue, generalized). A lead is never dropped on a bad signal. A write the database refuses
   ("permission denied") is retried later, unless the record's receipt (advisorQuiz/receipts/{id}, written in the same
   update) shows an earlier try landed: then it counts as sent, exactly once. */
const Outbox = (() => {
  let key = 'cybta:outbox', q = [], busy = false, dirty = false, timer = 0, netDelay = 2000, store = null, pill = null;
  const subs = {}, kindSubs = {};
  function save() { KV.setJSON(key, q); }
  function emit(job, state) { (subs[job.id] || []).concat(kindSubs[job.kind] || []).forEach(cb => { try { cb(state, job); } catch (e) { console.error(e); } }); }
  function showPill(on) {
    if (on && !pill) { pill = document.createElement('div'); pill.className = 'pill'; pill.textContent = 'Saving…'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
    if (!on && pill) { pill.remove(); pill = null; }
  }

    if (!store) return;

    if (busy) { dirty = true; return; }
    busy = true; dirty = false; clearTimeout(timer);
    let netFail = false, denyFail = false;
    const now = Date.now();
    const order = { lead: 0, play: 1, funnel: 2 }, list = q.slice().sort((x, y) => (order[x.kind] ?? 3) - (order[y.kind] ?? 3));
    for (let k = 0; k < list.length; k++) {
      const job = list[k];
      if (job.next && job.next > now) continue;
      const r = await store.send(job.method, job.path, job.body);
      job.tries = (job.tries || 0) + 1;
      // Refused: if this record's receipt is there, an earlier try landed (its answer was lost, or the browser quietly
      // retried it), so it's sent. Records can't be overwritten, so it can never land twice.
      if (r.denied && job.receipt) { try { if (await store.get(job.receipt, 8000) === true) r.ok = true; } catch (e) { /* still unknown */ } }
      if (r.ok || (r.denied && !job.receipt && job.net > 0)) { q = q.filter(j => j !== job); save(); emit(job, 'done'); continue; }
      if (r.net) { job.net = (job.net || 0) + 1; netFail = true; job.state = 'net'; }
      else if (r.denied) { denyFail = true; job.state = 'denied'; job.next = Date.now() + 5 * 60e3; }
      else { job.state = 'bad'; job.next = Date.now() + 10 * 60e3; if (job.tries >= 3) { q = q.filter(j => j !== job); console.warn('[outbox] dropped', job.kind, r.err); emit(job, 'dropped'); save(); continue; } }
      console.warn('[outbox]', job.kind, r.err);
      save(); emit(job, job.state);
      if (r.net) {   // no signal: the rest would fail the same way, so they wait too (and the page can say so)
        list.slice(k + 1).forEach(j => { if (!j.state || j.state === 'pending') { j.state = 'net'; emit(j, 'net'); } });
        save(); break;
      }

    q = q.filter(j => (Date.now() - (j.created || 0) < 30 * 864e5) && !(j.kind === 'funnel' && (j.tries || 0) >= 4));
    save();
    busy = false;
    if (dirty && !netFail) { dirty = false; setTimeout(flush, 0); return; }   // (a write added while this pass ran)
    const pending = q.some(j => j.state === 'net' && (j.kind === 'play' || j.kind === 'lead'));
    showPill(pending);
    if (netFail) { timer = setTimeout(flush, netDelay); netDelay = Math.min(60000, netDelay * 2); }
    else { netDelay = 2000; if (q.length) timer = setTimeout(flush, denyFail ? 5 * 60e3 + 500 : 60e3); }
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
  return {
    use(st) { store = st; key = 'cybta:outbox:' + st.mode; q = (KV.getJSON(key) || []).filter(j => j && j.path); },
    add(job) { const j = Object.assign({ id: rid(8, 'j'), tries: 0, net: 0, created: Date.now() }, job); q.push(j); save(); flush(); return j.id; },
    on(id, cb) { (subs[id] = subs[id] || []).push(cb); },
    onKind(kind, cb) { (kindSubs[kind] = kindSubs[kind] || []).push(cb); },
    has: id => q.some(j => j.id === id),
    state: id => { const j = q.find(x => x.id === id); return j ? (j.state || 'pending') : 'done'; },
    flush,
    get size() { return q.length; }
  };
})();

/* ============================== THE PAGE'S MODES ==============================
   live   the real database (players' writes count)
   test   ?test=1: the real database, but nothing touches the counters or the funnel; plays and leads are marked test,
          and "Back soon" doesn't apply (for the recruiting team's and legal's end-to-end checks)

const MODE = (URLP.get('demo') === '1' || !firebaseConfigured()) ? 'demo' : URLP.get('test') === '1' ? 'test' : 'live';

const TS = { '.sv': 'timestamp' };

let store = null;
const S = { config: null, stats: null, statsOk: false, run: null, later: [] };
const later = (ms, fn) => { const t = setTimeout(fn, ms); S.later.push(t); return t; };

const bankOf = v => BANKS[v] || null;

const SPEC_ORDER = Object.keys(SPECIALTIES);
const PART_COUNT = Object.keys(PARTS).length;
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const numWord = n => NUM_WORDS[n] || String(n);

/* ============================== ATTRIBUTION ==============================
   Kept on landing: the UTM tags, fbclid, gclid, ref, t (a shared style) and the cohort c, plus the referring domain.
   The first touch stays on the device; the latest lives in the session. Both ride on the play and the lead. */
const ATTR_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'gclid', 'ref', 't', 'c'];
const cleanKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 36);

/* ============================== CONFIG, COUNTERS ============================== */
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);

}
// Everything the page needs from the database, read once at the start: the config (under 1 KB) and this bank's
// counters (about 2 KB). Either can fail (no signal, rules not in yet): the assessment works without them.
async function loadShared() {
  const within = (p, ms) => Promise.race([store.get(p, ms), new Promise((_, no) => setTimeout(() => no(new Error('timeout')), ms + 500))]);
  const [c, s] = await Promise.allSettled([within(ROOT + '/config', 6000), within(ROOT + '/stats/' + BANK_VERSION, 8000)]);
  if (c.status === 'fulfilled') S.config = c.value || {};

  else console.warn('[stats]', s.reason);

}
// Counters live at stats/<version>/<metric>/<key>. (Firebase hands back an array when the keys are numbers; both index
// the same way.)
const cnt = (m, k) => { const o = S.stats && S.stats[m], v = o && o[k]; return typeof v === 'number' ? v : 0; };
const sumOf = m => ents(S.stats && S.stats[m]).reduce((a, [, n]) => a + (typeof n === 'number' ? n : 0), 0);

// "12% of players share your style": once a bank has minPlays counted plays.
function styleShare(key) {

  const n = countedPlays(); if (n < cfg().minPlays) return null;
  const k = cnt('type', key); return k ? Math.max(1, Math.round(100 * k / n)) : 0;
}
// The most common style among working advisors' plays, once there are advisorMin of them.
function advisorTop() {
  if (!S.statsOk || sumOf('adv-type') < QUIZ.advisorMin) return null;
  return STYLE_ORDER.reduce((best, k) => cnt('adv-type', k) > cnt('adv-type', best) ? k : best, STYLE_ORDER[0]);
}
// "38% of players chose this too": once a bank has crowdMin counted plays.
function crowdPct(it, o) {
  if (!S.statsOk) return null;

  return Math.round(100 * cnt('q-' + it.id, o) / n);
}
// Demo and test previews only: a made-up crowd of n plays, so the style shares and answer counts can be seen before

function seedStats(n) {
  const rnd = seeded(hash32('seed', n)), st = {};
  const add = (m, k) => { st[m] = st[m] || {}; st[m][k] = (st[m][k] || 0) + 1; };
  for (let k = 0; k < n; k++) {

      else { const o = one(); ans[i] = { o }; add('q-' + it.id, o); }

/* ============================== RUNS ==============================
   A run is one pass through the questions, kept on the device so the same link resumes at the same question with the
   same picks. After resumeHours it starts over. A finished run's blueprint stays, so the result page comes back. */

  if (!r.done && Date.now() - (r.started || 0) > QUIZ.resumeHours * 3600e3) return null;
  if (!r.ans) r.ans = {};
  if (!r.seen) r.seen = {};
  return r;
}
function newRun() {
  S.run = { v: BANK_VERSION, id: rid(10), started: Date.now(), i: -1, ans: {}, seen: {}, cohort: COHORT, src: sourceKey(), done: false };
  saveRun();
  return S.run;
}
const itemsOf = run => bankOf(run.v);
const partStart = (items, i) => i === 0 || items[i].part !== items[i - 1].part;

/* ============================== THE BLUEPRINT ============================== */
// The key with the most weight. A tie goes to whichever tied key comes first in `order` (the tie-break questions' picks).
function topOf(scores, order) {
  const keys = Object.keys(scores).filter(k => scores[k] > 0); if (!keys.length) return null;
  const max = Math.max(...keys.map(k => scores[k])), tied = keys.filter(k => Math.abs(scores[k] - max) < 1e-9);
  return order.find(k => tied.includes(k)) || tied.sort()[0];
}
function blueprintOf(items, ans) {
  const mix = {}, specMix = {}, pickOf = {}, life = { leave: [] };
  items.forEach((it, i) => {
    const a = ans[i]; if (!a) return;
    if (it.kind === 'multi') { life.leave = (a.m || []).map(o => it.options[o]).filter(Boolean); return; }
    const op = typeof a.o === 'number' ? it.options[a.o] : null; if (!op) return;
    pickOf[it.id] = op;
    if (it.kind === 'style') mix[op.s] = (mix[op.s] || 0) + (it.weight || 1);
    else if (it.kind === 'spec' || it.kind === 'grid') specMix[op.p] = (specMix[op.p] || 0) + (it.weight || 1);
    else if (it.kind === 'pick') life[it.key] = op;
  });
  const sOrder = TIEBREAK.style.map(id => pickOf[id] && pickOf[id].s).filter(Boolean);
  const pOrder = TIEBREAK.spec.map(id => pickOf[id] && pickOf[id].p).filter(Boolean);
  const style = topOf(mix, sOrder) || STYLE_ORDER[0], rest = Object.assign({}, mix);
  delete rest[style];
  const { when, where, why } = life;
  return {
    style, style2: topOf(rest, sOrder), spec: topOf(specMix, pOrder) || SPEC_ORDER[0], mix,
    when: when ? when.when : '', where: where ? where.where : '', why: why ? why.w : '', whyText: why ? why.why : '',
    leave: life.leave.map(o => o.leave),
    // the answers in the player's own words, for the lead
    said: { when: when ? when.text : '', where: where ? where.text : '', why: why ? why.text : '', leave: life.leave.map(o => o.text) }
  };
}
function resultOf(run) {
  const b = blueprintOf(itemsOf(run), run.ans);
  return Object.assign(b, { share: styleShare(b.style), adv: advisorTop(), plays: S.statsOk ? countedPlays() : null });
}
// "Problem-Solver" never breaks at its hyphen.
const keepWhole = html => html.replace(/(\S+-\S+)/g, '<span class="nw">$1</span>');
const setupOf = res => [res.when, res.where].filter(Boolean).join(', ');
// The style mix as whole percentages that add up to 100, biggest first (ties: the style, then the second style).
function mixOf(res) {
  const order = [res.style, res.style2].filter(Boolean).concat(STYLE_ORDER);
  const keys = STYLE_ORDER.filter(k => (res.mix[k] || 0) > 0).sort((a, b) => (res.mix[b] - res.mix[a]) || (order.indexOf(a) - order.indexOf(b)));
  const tot = keys.reduce((s, k) => s + res.mix[k], 0) || 1, raw = keys.map(k => 100 * res.mix[k] / tot), out = raw.map(Math.floor);
  let left = 100 - out.reduce((s, v) => s + v, 0);
  raw.map((v, n) => [v - out[n], n]).sort((x, y) => y[0] - x[0]).forEach(([, n]) => { if (left > 0) { out[n]++; left--; } });
  return keys.map((k, n) => [k, out[n]]);
}

/* ============================== WRITES: the play, the funnel ============================== */
// One write per finished run: a single multi-path PATCH that adds 1 to every counter the run touches and writes the
// play record. Counters count each device's first finished run of the bank, outside the advisor cohort and test mode;
// the advisor cohort adds only to adv-type.
function queuePlay(run, res) {
  const v = run.v, items = itemsOf(run), body = {};
  const count = run.first && run.cohort !== 'advisor' && run.cohort !== 'test';
  if (count) {
    body[`stats/${v}/type/${res.style}`] = INC;
    body[`stats/${v}/spec/${res.spec}`] = INC;
    items.forEach((it, i) => {
      const a = run.ans[i]; if (!a) return;
      (it.kind === 'multi' ? (a.m || []) : [a.o]).forEach(o => { if (typeof o === 'number') body[`stats/${v}/q-${it.id}/${o}`] = INC; });
    });
  }
  if (run.first && run.cohort === 'advisor') body[`stats/${v}/adv-type/${res.style}`] = INC;
  body[`receipts/${run.id}`] = true;
  body[`plays/${v}/${run.id}`] = {
    t: TS, type: res.style, type2: res.style2 || '', spec: res.spec,
    a: items.map((it, i) => { const a = run.ans[i]; if (!a) return -1; return it.kind === 'multi' ? (a.m || []).join('-') : (typeof a.o === 'number' ? a.o : -1); }),
    first: !!run.first, cohort: run.cohort, src: run.src, secs: Math.round((Date.now() - run.started) / 1000)
  };
  return Outbox.add({ kind: 'play', method: 'PATCH', path: ROOT, body, receipt: `${ROOT}/receipts/${run.id}` });
}
// The funnel: one counter per stage per bank version, overall and again per source and campaign. Each stage counts
// once per device (a reload doesn't add another view). Test mode adds nothing; the advisor cohort only to its own row.
function funnel(stage) {
  if (MODE === 'test' || ROLE === 'admin') return;
  const v = BANK_VERSION, seenKey = 'cybta:funnel:' + MODE + ':' + v, seen = KV.getJSON(seenKey) || {};
  if (seen[stage]) return;
  seen[stage] = Date.now(); KV.setJSON(seenKey, seen);
  const body = {};
  if (COHORT !== 'advisor') body[`all/${stage}`] = INC;
  body[`s-${sourceKey()}/${stage}`] = INC;
  const cmp = cleanKey(ATTR.last.utm_campaign); if (cmp && COHORT !== 'advisor') body[`c-${cmp}/${stage}`] = INC;
  Outbox.add({ kind: 'funnel', method: 'PATCH', path: `${ROOT}/funnel/${v}`, body });
}

/* ============================== THE AD PIXEL ==============================
   Loads only when ANALYTICS.metaPixelId is set, on the live site. Three events: ViewContent (landing seen), QuizComplete
   (the blueprint shown) and Lead (the database confirmed a lead). No name, email or phone ever goes to it: no parameters
   are sent, and automatic configuration (which can read forms) is switched off before init. */
const Pixel = (() => {
  const id = String(ANALYTICS.metaPixelId || '').trim(), fired = {};
  let ready = false;
  function init() {
    if (!id || MODE !== 'live' || ROLE === 'admin') return;
    /* eslint-disable */
    !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');

  }
  function track(ev, custom) { if (!ready || fired[ev]) return; fired[ev] = 1; try { custom ? window.fbq('trackCustom', ev) : window.fbq('track', ev); } catch (e) { /* ignore */ } }
  return { init, track };
})();

/* ============================== THE FRAME ============================== */
const main = () => $('#main');

  });

}
function paintSound() {
  const b = $('#snd'); if (!b) return;
  b.innerHTML = Sfx.on ? ICON.soundOn : ICON.soundOff;

function mount(html, top) {

const say = msg => { const l = $('#live'); if (l) { l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30); } };

/* ============================== QUESTIONS ============================== */
function goItem(i) {
  const run = S.run, items = itemsOf(run);
  run.i = i; saveRun();
  if (partStart(items, i) && i > 0) funnel('p' + items[i].part);
  showItem(i);
}
// The card that opens each part (once per run; Back and a resume don't show it again once it's been seen).
function partCard(it, done) {
  const P = PARTS[it.part] || { name: '', note: '' }, el = document.createElement('div');
  el.className = 'tcard enter'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `Part ${it.part} of ${PART_COUNT}: ${P.name}`);
  el.innerHTML = `<div class="in"><div class="k">Part ${it.part} of ${PART_COUNT}</div><h2>${esc(P.name)}</h2><p>${esc(P.note)}</p><div class="rule"></div></div>`;
  document.body.appendChild(el);
  let gone = false, t = 0;
  const close = () => { if (gone) return; gone = true; clearTimeout(t); el.classList.add('leave'); setTimeout(() => el.remove(), 260); done(); };
  el.addEventListener('click', close);
  el.addEventListener('keydown', close);
  el.tabIndex = -1; try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  t = setTimeout(close, 1900);
  Sfx.whoosh();
}
function preload(it) {
  if (!it) return;
  [it.photo].concat(it.kind === 'grid' ? it.options.map(o => o.thumb) : []).filter(Boolean).forEach(src => { const im = new Image(); im.src = src; });
}
function showItem(i) {
  const run = S.run, items = itemsOf(run), it = items[i], N = items.length, P = PARTS[it.part] || {};
  const m = mount(`
    <div class="wrap item${it.photo ? '' : ' bare'}">
      ${it.photo ? `<figure class="photo"><img alt="${esc(it.alt || '')}" decoding="async">${it.credit ? `<figcaption class="credit">Photo: ${it.credit}</figcaption>` : ''}</figure>` : ''}
      <div class="chips"><span class="chip part"><span>Part ${it.part}: ${esc(P.name)}</span></span>${i > 0 ? `<button class="back" type="button" id="back">${ICON.back}<span>Back</span></button>` : ''}</div>
      <h1 class="q${it.kind === 'multi' ? ' withhint' : ''}" id="q" tabindex="-1">${esc(it.question)}</h1>
      ${it.kind === 'multi' ? `<p class="qhint">Pick up to ${numWord(it.max)}.</p>` : ''}
      <div id="act"></div>
      <div id="after"></div>
    </div>`, i);
  if (it.photo) {
    const img = $('.photo img', m);
    img.onload = () => img.classList.add('on'); img.onerror = () => { img.closest('.photo').hidden = true; };
    img.src = it.photo;
  }
  preload(items[i + 1]);
  if (i > 0) $('#back', m).onclick = () => goItem(i - 1);
  buildAsk(i);
  if (answered(run, i)) showInsight(i, true);
  const begin = () => {
    if (!run.seen[i]) { run.seen[i] = 1; saveRun(); }
    try { $('#q').focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    say(`Question ${i + 1} of ${N}. ${it.question}`);
  };
  if (!run.seen[i] && partStart(items, i)) partCard(it, begin);
  else { if (!run.seen[i]) Sfx.whoosh(); begin(); }
}
// The options: lettered cards (one pick), photo tiles (one pick) or check cards (up to it.max).
function buildAsk(i) {
  const run = S.run, it = itemsOf(run)[i], act = $('#act');
  if (it.kind === 'grid') {
    act.innerHTML = `<ul class="tiles">${it.options.map((op, o) => `<li><button class="tile" type="button" data-o="${o}" aria-pressed="false"><span class="tim"><img src="${esc(op.thumb)}" alt="" decoding="async"></span><span class="tt">${esc(op.text)}</span><span class="ts">${esc(op.sub || '')}</span><span class="tick" aria-hidden="true">${ICON.check}</span></button></li>`).join('')}</ul>${it.credit ? `<p class="tcredit">${it.credit}</p>` : ''}`;
  } else if (it.kind === 'multi') {
    act.innerHTML = `<ul class="opts multi">${it.options.map((op, o) => `<li><button class="opt" type="button" data-o="${o}" aria-pressed="false"><span class="box" aria-hidden="true">${ICON.check}</span><span>${esc(op.text)}</span></button></li>`).join('')}</ul><p class="mhint" id="mhint" aria-live="polite"></p>`;
  } else {
    act.innerHTML = `<ul class="opts">${optionOrder(run, it).map((o, k) => `<li><button class="opt" type="button" data-o="${o}" aria-pressed="false"><span class="key" aria-hidden="true">${'ABCDEFGH'[k]}</span><span>${esc(it.options[o].text)}</span></button></li>`).join('')}</ul>`;
  }
  $$('[data-o]', act).forEach(b => {
    b.onclick = e => {
      choose(i, +b.dataset.o);
      // From the keyboard (Enter or Space), a single pick moves focus on to Next; a mouse or a tap stays put.
      if (e && e.detail === 0 && it.kind !== 'multi') { const nb = $('#next'); if (nb) try { nb.focus({ preventScroll: true }); } catch (x) { /* ignore */ } }
    };
  });
  paintPicks(i);
}
function paintPicks(i) {
  const run = S.run, it = itemsOf(run)[i], a = run.ans[i], act = $('#act'); if (!act) return;
  const picked = it.kind === 'multi' ? ((a && a.m) || []) : (a && typeof a.o === 'number' ? [a.o] : []);
  const full = it.kind === 'multi' && picked.length >= it.max;
  $$('[data-o]', act).forEach(b => {
    const on = picked.includes(+b.dataset.o);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.classList.toggle('pick', on);
    b.classList.toggle('full', full && !on);
  });
  const mh = $('#mhint', act);
  if (mh) { mh.classList.remove('nudge'); mh.textContent = !picked.length ? '' : full ? `That’s ${numWord(it.max)}. Tap one to swap it out.` : `${cap(numWord(picked.length))} picked. You can add ${numWord(it.max - picked.length)} more.`; }
}
function choose(i, o) {
  const run = S.run, it = itemsOf(run)[i]; if (!it.options[o]) return;
  if (it.kind === 'multi') {
    const cur = (run.ans[i] && run.ans[i].m) || [];
    if (!cur.includes(o) && cur.length >= it.max) {
      const mh = $('#mhint');
      if (mh) { mh.textContent = `You can pick up to ${numWord(it.max)}. Tap one you’ve picked to swap it out.`; mh.classList.remove('nudge'); void mh.offsetWidth; mh.classList.add('nudge'); }
      buzz(30); return;
    }
    const next = cur.includes(o) ? cur.filter(x => x !== o) : cur.concat(o);
    if (next.length) run.ans[i] = { m: next, at: Date.now() }; else delete run.ans[i];
  } else {
    if (run.ans[i] && run.ans[i].o === o) return;   // the same pick again: nothing changes
    run.ans[i] = { o, at: Date.now() };
  }
  saveRun(); Sfx.pop(); buzz(15);
  paintPicks(i); paintTop(i);
  showInsight(i, false);
}
function insightOf(it, a) {
  if (it.kind === 'multi') return { text: `You’d leave behind ${joinAnd(a.m.map(o => it.options[o].leave))}. ${it.after || ''}`.trim(), crowd: '' };
  const op = it.options[a.o], pc = crowdPct(it, a.o);
  return { text: op.insight + (it.after ? ' ' + it.after : ''), crowd: pc == null ? '' : pc < 1 ? 'Few players have chosen this one so far' : `${pc}% of players chose this too` };
}
// The insight for the pick, and Next. Changing the pick swaps the insight in place.
function showInsight(i, instant) {
  const run = S.run, items = itemsOf(run), it = items[i], a = run.ans[i], after = $('#after'), N = items.length, last = i >= N - 1;
  if (!after) return;
  if (!answered(run, i)) { after.innerHTML = ''; return; }
  const { text, crowd } = insightOf(it, a), fresh = !$('.insight', after);
  after.innerHTML = `<div class="insight${instant ? '' : fresh ? ' enter' : ' swap'}"><span class="ic">${ICON.bulb}</span><div><p>${esc(text)}</p>${crowd ? `<p class="crowd">${ICON.people}<span>${esc(crowd)}</span></p>` : ''}</div></div>
    <div class="next"><button class="btn" type="button" id="next">${last ? 'See my blueprint' : 'Next question'} ${ICON.arrow}</button>${last ? '' : `<p>${i + 2 === N ? 'Last question next' : `${i + 2} of ${N} next`}</p>`}</div>`;
  $('#next', after).onclick = () => { if (last) finish(); else goItem(i + 1); };
  if (instant) return;
  if (fresh) {
    try { const nx = $('.next', after), r = nx.getBoundingClientRect(); if (r.bottom > innerHeight - 8) nx.scrollIntoView({ block: 'end', behavior: calmMotion() ? 'auto' : 'smooth' }); } catch (e) { /* ignore */ }
  }
  say(text + (crowd ? '. ' + crowd + '.' : ''));
}

/* ============================== THE RESULT ============================== */
function finish() {
  const run = S.run; if (!run) return;
  if (!run.done) {
    const firstKey = 'cybta:first:' + MODE + ':' + run.v;
    run.first = !KV.get(firstKey) && MODE !== 'test';
    if (run.first) KV.set(firstKey, run.id);
    run.result = resultOf(run);
    run.done = true; run.finishedAt = Date.now(); saveRun();
    queuePlay(run, run.result);
    funnel('complete'); Pixel.track('QuizComplete', true);
  }
  showResult(true);
}
// "Building your blueprint": two reels, the style and then the specialty, roll and land over the result page. A tap,
// Skip or Escape lands them at once; reduced motion skips it entirely.
function revealBlueprint(res, done) {
  const el = document.createElement('div');
  el.className = 'build'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Building your blueprint');
  el.innerHTML = `<div class="in">
      <div class="k">Building your blueprint</div>
      <div class="row" id="rb1"><div class="lab">Your style</div><div class="win"></div></div>
      <div class="row" id="rb2"><div class="lab">Your specialty</div><div class="win"></div></div>
      <button class="skip" type="button" id="bskip">Skip</button>
    </div>`;
  document.body.appendChild(el);
  const r1 = Reel($('#rb1 .win', el), STYLE_ORDER.map(k => STYLES[k].name), STYLE_ORDER.indexOf(res.style), hash32(S.run.id, 'style'));
  const r2 = Reel($('#rb2 .win', el), SPEC_ORDER.map(k => SPECIALTIES[k].name), SPEC_ORDER.indexOf(res.spec), hash32(S.run.id, 'spec'));
  const timers = [], at = (ms, fn) => timers.push(setTimeout(fn, ms));
  let closed = false, skipping = false;
  const lock = (n, big) => { const row = $('#rb' + n, el); if (row && !row.classList.contains('locked')) { row.classList.add('locked'); Sfx.clunk(big ? 2 : 1); buzz(big ? [20, 40, 60] : 25); } };
  const close = () => {
    if (closed) return; closed = true; timers.forEach(clearTimeout);
    r1.land(); r2.land(); lock(1); lock(2, true);
    el.classList.add('leave'); setTimeout(() => el.remove(), 300);
    done();
  };
  const skip = () => { if (closed || skipping) return; skipping = true; timers.forEach(clearTimeout); r1.land(); r2.land(); lock(1); lock(2, true); setTimeout(close, 500); };
  el.addEventListener('click', skip);
  el.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skip(); } });
  try { $('#bskip', el).focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  Sfx.open();
  at(250, () => { Sfx.whir(3.3); r1.spin(1700, () => lock(1)); });
  at(2050, () => r2.spin(1500, () => lock(2, true)));
  at(4300, close);
}
function showResult(fresh) {
  const run = S.run, res = run.result, items = itemsOf(run);
  const T = STYLES[res.style], T2 = res.style2 ? STYLES[res.style2] : null, SP = SPECIALTIES[res.spec];
  const reveal = fresh && !calmMotion();
  const rarity = res.share == null ? '' : res.share === 0 ? 'You’re the first player with this style.' : res.share < 15 ? `Only ${res.share}% of players share your style.` : `${res.share}% of players share your style.`;
  const advLine = res.adv ? `Among working Avoya advisors who’ve taken this assessment, the most common style is ${STYLES[res.adv].name}.` : '';
  const mix = mixOf(res), nStyleQs = items.filter(it => it.kind === 'style').length;
  const bars = mix.map(([k, p]) => `<li><div class="top2"><b>${esc(STYLES[k].short)}</b><span>${p}%</span></div><div class="bar" role="img" aria-label="${esc(STYLES[k].short)}: ${p}% of your answers"><i class="${k === res.style ? 'up' : ''}" data-w="${p}%"></i></div></li>`).join('');

function editDistance(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}

  let best = null, bd = 3;
  COMMON_DOMAINS.forEach(c => { const dd = editDistance(dom, c); if (dd < bd) { bd = dd; best = c; } });

      try { await firebase.auth().signInWithPopup(prov); }
      catch (e) {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) { try { await firebase.auth().signInWithRedirect(prov); return; } catch (e2) { e = e2; } }
        signInView(authMessage(e));
      }
    };
  }
  async function checkAdmin() {
    paint('<h1>Assessment admin</h1><p>Checking the admin list…</p>');
    let ok = false, denied = false;
    try { ok = (await api.get(`${ROOT}/admins/${user.uid}`)) === true; }
    catch (e) { denied = /permission/i.test(String(e && (e.code || e.message))); }
    if (ok) return dash(false);
    const m = paint(`<h1>Assessment admin</h1>
      <p>Signed in as <b>${esc(user.email || user.uid)}</b>, but this account isn’t on the admin list${denied ? ' (or the advisorQuiz rules aren’t in the database yet)' : ''}.</p>
      <div class="card"><p style="margin-top:0">To add it: Firebase console → Realtime Database → Data → under <code>${esc(ROOT)}</code> add <code>admins</code> → <code>${esc(user.uid)}</code> with the value <code>true</code>.</p>
      <div class="row"><button class="btn small line" type="button" id="cpuid">Copy my user ID</button><button class="btn small line" type="button" id="out">Sign out</button></div></div>`);
    $('#cpuid', m).onclick = async () => { toast((await copyText(user.uid)) ? 'Copied.' : user.uid); };
    $('#out', m).onclick = () => firebase.auth().signOut();
  }

  /* ---------- the dashboard ---------- */
  const STAGES = ['view', 'start', 'p2', 'p3', 'complete', 'step1-curious', 'step1-considering', 'step1-advisor', 'lead', 'share'];
  const STAGE_LABEL = { view: 'Landing', start: 'Started', p2: 'Part 2', p3: 'Part 3', complete: 'Finished', 'step1-curious': 'Curious', 'step1-considering': 'Considering', 'step1-advisor': 'Advisor', lead: 'Leads', share: 'Shared' };
  const pctOf = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';
  // Counts with each one's share of the counted players.
  function countTable(rows, total, head, extra) {
    if (!total) return '<p class="note">Nothing counted yet.</p>';
    return `<table><thead><tr><th>${esc(head)}</th><th class="n">Players</th><th class="n">Share</th>${extra ? `<th class="n">${esc(extra)}</th>` : ''}</tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${fmtNum(r[1])}</td><td class="n">${pctOf(r[1], total)}</td>${extra ? `<td class="n">${fmtNum(r[2])}</td>` : ''}</tr>`).join('')}</tbody></table>`;
  }
  const optRows = it => it.options.map((op, o) => [op.text.replace(/^“|”$/g, ''), cnt('q-' + it.id, o)]);
  async function dash(demo) {
    const v = BANK_VERSION;
    const [conf, stats, fun, leads] = await Promise.all([
      api.get(`${ROOT}/config`).catch(() => null), api.get(`${ROOT}/stats/${v}`).catch(() => null),
      api.get(`${ROOT}/funnel/${v}`).catch(e => ({ __err: e })), api.get(`${ROOT}/leads`).catch(e => ({ __err: e }))
    ]);
    S.config = conf || {}; S.stats = stats || {}; S.statsOk = !!stats;
    const c = cfg(), n = countedPlays(), advN = sumOf('adv-type'), advTop = advisorTop();
    leadsCache = ents(leads && !leads.__err ? leads : {}).map(([id, l]) => Object.assign({ id }, l)).sort((a, b) => (b.t || 0) - (a.t || 0));
    const life = BANK.filter(it => it.part === PART_COUNT);
    const m = paint(`
      <h1>Assessment admin</h1>
      <p class="row" style="margin:0 0 6px">${demo ? '<span class="chip ex">Demo data</span>' : `Signed in as ${esc(user.email || user.uid)} <button class="linkbtn" type="button" id="out">Sign out</button>`}</p>
      ${!c.live ? '<p class="warn">The assessment is switched off: players see “Back soon”.</p>' : ''}
      <h2>Settings</h2>
      <div class="card"><div class="row">
        <label class="switch"><input type="checkbox" id="live" ${c.live ? 'checked' : ''}> Assessment is live</label>
        <label>Style shares after <input type="number" id="minp" min="1" step="1" value="${c.minPlays}" style="width:90px"> plays</label>
        <button class="btn small" type="button" id="savecfg">Save</button>
      </div><p class="note" style="margin-bottom:0">Bank version <code>${esc(v)}</code>, ${BANK.length} questions. A new question or a changed option bumps the version in the file, which starts fresh counters.</p></div>
      <h2>Players (counted plays of ${esc(v)})</h2>
      <div class="kv">
        <div><b>${fmtNum(n)}</b><span>counted plays (each device’s first finish)</span></div>
        <div><b>${fmtNum(advN)}</b><span>working-advisor plays${advTop ? `; most common style: ${esc(STYLES[advTop].short)}` : ''}</span></div>
      </div>
      <div class="grid2">
        <div><h3>Styles</h3>${countTable(STYLE_ORDER.map(k => [STYLES[k].name, cnt('type', k), cnt('adv-type', k)]), n, 'Style', 'Advisors')}</div>
        <div><h3>Specialties</h3>${countTable(SPEC_ORDER.map(k => [SPECIALTIES[k].name, cnt('spec', k)]), n, 'Specialty')}</div>
      </div>
      <h2>The life they want (Part ${PART_COUNT})</h2>
      <div class="grid2">${life.map(it => `<div><h3>${esc(it.question)}</h3>${countTable(optRows(it), n, 'Answer')}${it.kind === 'multi' ? `<p class="note">Players could pick up to ${numWord(it.max)}, so the shares add up to more than 100%.</p>` : ''}</div>`).join('')}</div>
      <details class="more"><summary>Every answer, question by question</summary>
        ${BANK.filter(it => it.part !== PART_COUNT).map((it, k) => `<h3>${k + 1}. ${esc(it.question)}</h3>${countTable(it.options.map((op, o) => [op.text.replace(/^“|”$/g, '') + (op.s ? ' (' + STYLES[op.s].short + ')' : op.p ? ' (' + SPECIALTIES[op.p].name + ')' : ''), cnt('q-' + it.id, o)]), n, 'Answer')}`).join('')}
      </details>
      <h2>Funnel by source</h2>
      ${fun && fun.__err ? `<p class="warn">Couldn’t read the funnel: ${esc(fun.__err.message || fun.__err)}</p>` : funnelTable(fun || {})}
      <h2>Leads <span class="note" style="display:inline">(${leadsCache.length})</span></h2>
      ${leads && leads.__err ? `<p class="warn">Couldn’t read the leads: ${esc(leads.__err.message || leads.__err)}</p>` : `
      <div class="row" style="margin-bottom:10px">
        <label>Show <select id="lf"><option value="all">Everyone</option>${Object.entries(FORM.stages).map(([k, s]) => `<option value="${k}">${esc(s.label)}</option>`).join('')}<option value="test">Test leads</option></select></label>
        <button class="btn small" type="button" id="csv">Download CSV</button>
      </div>
      <div class="scroll" id="leads"></div>`}`);
    if (!demo) $('#out', m).onclick = () => firebase.auth().signOut();
    $('#savecfg', m).onclick = async () => {
      const body = { live: $('#live', m).checked, minPlays: Math.max(1, Math.round(+$('#minp', m).value || QUIZ.minPlays)) };
      try { await api.update(`${ROOT}/config`, body); toast('Saved.'); dash(demo); } catch (e) { toast('Couldn’t save: ' + (e.message || e)); }
    };
    const sel = $('#lf', m);
    if (sel) { sel.value = filter; sel.onchange = () => { filter = sel.value; paintLeads(demo); }; $('#csv', m).onclick = downloadCsv; paintLeads(demo); }
  }
  function funnelTable(fun) {
    const rows = ents(fun).map(([k, o]) => [k, o || {}]).sort((a, b) => (a[0] === 'all' ? -1 : b[0] === 'all' ? 1 : (b[1].view || 0) - (a[1].view || 0)));
    if (!rows.length) return '<p class="note">Nothing counted yet.</p>';
    const name = k => k === 'all' ? '<b>Everyone</b>' : k.startsWith('s-') ? esc(k.slice(2)) : k.startsWith('c-') ? 'Campaign: ' + esc(k.slice(2)) : esc(k);
    return `<div class="scroll"><table><thead><tr><th>Source</th>${STAGES.map(s => `<th class="n">${STAGE_LABEL[s]}</th>`).join('')}<th class="n">Finish rate</th><th class="n">Lead rate</th></tr></thead><tbody>
      ${rows.map(([k, o]) => `<tr><td>${name(k)}</td>${STAGES.map(s => `<td class="n">${fmtNum(o[s] || 0)}</td>`).join('')}<td class="n">${pctOf(o.complete || 0, o.start || 0)}</td><td class="n">${pctOf(o.lead || 0, o.complete || 0)}</td></tr>`).join('')}
      </tbody></table></div><p class="note">Each stage counts once per device. Finish rate = finished ÷ started; lead rate = leads ÷ finished.</p>`;
  }
  const when = t => t ? new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
  const styleName = k => STYLES[k] ? STYLES[k].name : '';
  const specName = k => SPECIALTIES[k] ? SPECIALTIES[k].name : '';
  function paintLeads(demo) {
    const box = $('#leads'); if (!box) return;
    const counts = {}; leadsCache.forEach(l => { const e = String(l.email || '').toLowerCase(); counts[e] = (counts[e] || 0) + 1; });
    const list = leadsCache.filter(l => filter === 'all' ? true : filter === 'test' ? l.test : l.stage === filter);
    if (!list.length) { box.innerHTML = '<p class="note">No leads here yet.</p>'; return; }
    box.innerHTML = `<table><thead><tr><th>When</th><th>Answer</th><th>Name</th><th>Email</th><th>Phone</th><th>Style</th><th>Specialty</th><th>Why</th><th>Source</th><th></th></tr></thead><tbody>
      ${list.map(l => { const p = l.play || {}; return `<tr><td>${when(l.t)}${l.test ? ' <span class="chip ex">test</span>' : ''}</td><td>${esc((FORM.stages[l.stage] || {}).label || l.stage)}</td><td>${esc(l.name)}</td>
        <td>${esc(l.email)}${counts[String(l.email || '').toLowerCase()] > 1 ? ' <span class="dupe" title="This email appears more than once">repeat</span>' : ''}</td><td>${esc(l.phone || '')}</td>
        <td>${esc(styleName(p.style))}</td><td>${esc(specName(p.spec))}</td><td>${esc(p.why || '')}</td><td>${esc((l.src && l.src.key) || '')}</td>
        <td><button class="linkbtn" type="button" data-del="${esc(l.id)}">Delete</button></td></tr>`; }).join('')}
      </tbody></table>`;
    $$('[data-del]', box).forEach(b => b.onclick = async () => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Click again to delete'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Delete'; } }, 4000); return; }
      try { await api.remove(`${ROOT}/leads/${b.dataset.del}`); leadsCache = leadsCache.filter(l => l.id !== b.dataset.del); toast('Deleted.'); paintLeads(demo); }
      catch (e) { toast('Couldn’t delete: ' + (e.message || e)); }
    });
  }
  // Every field that travels with a lead, so the recruiter opens the call already knowing the person.
  function downloadCsv() {
    const counts = {}; leadsCache.forEach(l => { const e = String(l.email || '').toLowerCase(); counts[e] = (counts[e] || 0) + 1; });
    const A = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'ref', 't', 'c', 'referrer', 'fbclid', 'gclid'];
    const head = ['lead_id', 'time', 'answer', 'experience', 'first_name', 'email', 'phone', 'email_consent', 'phone_consent', 'consent_version', 'consent_time', 'style', 'second_style', 'specialty', 'work_when', 'work_where', 'why', 'leave_behind', 'bank_version', 'play_id', 'first_play', 'cohort', 'source']
      .concat(A.map(k => 'first_' + k), ['first_at'], A.map(k => 'last_' + k), ['last_at', 'test', 'repeated_email']);
    const iso = t => t ? new Date(t).toISOString() : '';
    const rows = leadsCache.map(l => {
      const p = l.play || {}, cs = l.consent || {}, f = (l.src && l.src.first) || {}, la = (l.src && l.src.last) || {};
      return [l.id, iso(l.t), l.stage, l.experience, l.name, l.email, l.phone || '', cs.email ? 'yes' : 'no', cs.phone ? 'yes' : 'no', cs.v || '', iso(cs.t), styleName(p.style), styleName(p.style2), specName(p.spec), p.when || '', p.where || '', p.why || '', p.leave || '', p.v, p.id, p.first ? 'yes' : 'no', l.cohort || '', (l.src && l.src.key) || '']
        .concat(A.map(k => f[k] || ''), [iso(f.at)], A.map(k => la[k] || ''), [iso(la.at), l.test ? 'yes' : '', counts[String(l.email || '').toLowerCase()] > 1 ? 'yes' : '']);
    });
    const cell = v => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) || /^[=+\-@]/.test(s) ? '"' + (/^[=+\-@]/.test(s) ? "'" : '') + s.replace(/"/g, '""') + '"' : s; };
    const csv = [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `advisor-quiz-leads-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  return { boot };
})();

</script>
</body>
</html>
